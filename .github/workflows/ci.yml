name: Validate extension

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Node app and extension assets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          node --check index.js
          node --check background.js
          node --check popup.js

      - name: Validate extension manifest
        run: |
          node -e "const fs = require('fs'); const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); if (manifest.manifest_version !== 3) throw new Error('Expected Manifest V3'); for (const key of ['name', 'version', 'background']) if (!manifest[key]) throw new Error('Missing manifest field: ' + key);"

      - name: Smoke-test the HTTP entrypoint
        run: |
          node index.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ | grep --quiet 'browser extension boilerplate collection'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
