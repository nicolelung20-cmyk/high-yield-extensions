<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Finder Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a66c2 0%, #00a4ef 100%);
        }

        .container {
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: white;
            color: #0a66c2;
        }

        .content {
            display: none;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 12px;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            font-family: Arial, sans-serif;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0a66c2;
            box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.1);
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #0a66c2 0%, #00a4ef 100%);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(10, 102, 194, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 11px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .history {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: #f5f5f5;
        }

        .history-email {
            font-weight: bold;
            color: #0a66c2;
        }

        .history-meta {
            color: #666;
            font-size: 10px;
            margin-top: 2px;
        }

        .credits-bar {
            background: #f0f0f0;
            border-radius: 4px;
            height: 6px;
            margin-top: 8px;
            overflow: hidden;
        }

        .credits-used {
            background: #0a66c2;
            height: 100%;
            transition: width 0.3s;
        }

        .credits-text {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Email Finder Pro</h1>
            <p>Find business emails instantly</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="finder">Finder</button>
            <button class="tab-btn" data-tab="history">History</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </div>

        <!-- Finder Tab -->
        <div id="finder" class="content active">
            <div class="form-group">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" placeholder="John">
            </div>
            <div class="form-group">
                <label for="domain">Domain:</label>
                <input type="text" id="domain" placeholder="acme.com">
            </div>
            <button id="findBtn">Find Email</button>
            <div id="finderStatus" class="status"></div>
        </div>

        <!-- History Tab -->
        <div id="history" class="content">
            <h3 style="font-size: 14px; margin-bottom: 10px;">Recent Searches</h3>
            <div id="historyList" class="history">
                <p style="text-align: center; color: #999; padding: 20px 0; font-size: 12px;">No history yet</p>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settings" class="content">
            <div class="form-group">
                <label>API Provider:</label>
                <select id="apiProvider">
                    <option value="hunter">Hunter.io</option>
                    <option value="clearbit">Clearbit</option>
                </select>
            </div>
            <div class="form-group">
                <label for="hunterKey">Hunter.io API Key:</label>
                <input type="password" id="hunterKey" placeholder="sk-...">
                <p style="font-size: 10px; color: #666; margin-top: 4px;">Get at <a href="https://hunter.io" target="_blank" style="color: #0a66c2;">hunter.io</a></p>
            </div>
            <div class="form-group">
                <label for="clearbitKey">Clearbit API Key:</label>
                <input type="password" id="clearbitKey" placeholder="sk-...">
                <p style="font-size: 10px; color: #666; margin-top: 4px;">Get at <a href="https://clearbit.com" target="_blank" style="color: #0a66c2;">clearbit.com</a></p>
            </div>
            <div class="form-group">
                <label for="creditsLimit">Monthly Credits:</label>
                <input type="number" id="creditsLimit" value="1000" min="100" step="100">
            </div>
            <button id="saveBtn">Save Settings</button>
            <div id="settingsStatus" class="status"></div>
            <div style="margin-top: 15px; padding: 10px; background: #f0f0f0; border-radius: 4px;">
                <div style="font-weight: bold; font-size: 12px; margin-bottom: 5px;">Credits Used</div>
                <div class="credits-bar">
                    <div id="creditsUsedBar" class="credits-used" style="width: 0%;"></div>
                </div>
                <div id="creditsText" class="credits-text">0 / 1000</div>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
